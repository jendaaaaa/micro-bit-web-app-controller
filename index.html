<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>micro:bit Web Controller</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <h2>Simple micro:bit Web Controller</h2>
    <button id="connectBtn">Connect</button>
    <div id="status">Status: Disconnected</div>

    <div class="dpad">
        <div id="btn-f" class="dpad-btn" data-id="f">⬆️</div>
        <div id="btn-l" class="dpad-btn" data-id="l">⬅️</div>
        <div id="btn-r" class="dpad-btn" data-id="r">➡️</div>
        <div id="btn-b" class="dpad-btn" data-id="b">⬇️</div>
    </div>
</body>

</html>
